<!doctype html>
<!--
  Fondo de la portada (pg00Portada). Solo formas: los textos y las cifras son visuales
  de Power BI encima de la imagen, para que se puedan editar en Desktop.
  Para volver a generar el PNG (1920 x 1080):
    python scripts/pbip/generar_reporte_pbir.py --render-portada
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --azul: #1F3A5F; --azul-osc: #132740; --azul-claro: #8FA8C8;
    --verde: #2E7D32; --rojo: #C62828; --naranja: #EF8F00; --gris: #9E9E9E;
    --fondo: #F4F6F9; --borde: #DDE2EA;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--fondo); }
  .izq {
    position: absolute; left: 0; top: 0; width: 1120px; height: 960px; overflow: hidden;
    background: linear-gradient(135deg, #24466F 0%, var(--azul) 45%, var(--azul-osc) 100%);
    box-shadow: 12px 0 40px rgba(19, 39, 64, .18);
  }
  .puntos {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.07) 1.6px, transparent 1.8px);
    background-size: 28px 28px;
    -webkit-mask-image: linear-gradient(160deg, #000 0%, rgba(0,0,0,.25) 60%, transparent 85%);
  }
  .halo {
    position: absolute; width: 760px; height: 760px; right: -260px; top: -300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(143,168,200,.22) 0%, rgba(143,168,200,0) 70%);
  }
  .anillo { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.08); }
  .barra { position: absolute; left: 96px; top: 548px; display: flex; gap: 8px; }
  .barra span { width: 56px; height: 6px; border-radius: 3px; }
  .der-circulo {
    position: absolute; width: 520px; height: 520px; border-radius: 50%; right: -180px; top: -200px;
    background: #E9EEF5;
  }
  .der-circulo2 {
    position: absolute; width: 260px; height: 260px; border-radius: 50%; right: 120px; top: 760px;
    border: 2px solid #E3E9F1;
  }
  .pie {
    position: absolute; left: 0; top: 960px; width: 1920px; height: 120px; background: #FFFFFF;
    border-top: 1px solid var(--borde);
  }
  .pie .acento { position: absolute; left: 0; top: -1px; width: 1120px; height: 4px;
    background: linear-gradient(90deg, var(--azul-claro), rgba(143,168,200,0)); }
</style>
</head>
<body>
  <div class="der-circulo"></div>
  <div class="der-circulo2"></div>

  <div class="izq">
    <div class="puntos"></div>
    <div class="halo"></div>
    <div class="anillo" style="width:520px;height:520px;right:-150px;top:-170px"></div>
    <div class="anillo" style="width:700px;height:700px;right:-240px;top:-260px"></div>

    <!-- Ícono de carrito (trazo fino) -->
    <svg style="position:absolute; left:840px; top:120px" width="190" height="170" viewBox="0 0 190 170"
         fill="none" stroke="rgba(255,255,255,.22)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 18 H38 L60 112 H156 L176 46 H48"/>
      <path d="M70 80 H164"/>
      <circle cx="74" cy="142" r="12"/>
      <circle cx="144" cy="142" r="12"/>
    </svg>

    <!-- Tres años de ventas mensuales (forma ilustrativa, no son los datos) -->
    <svg style="position:absolute; left:0; top:740px" width="1120" height="220" viewBox="0 0 1120 220">
      <defs>
        <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
          <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0 150 C 90 140, 150 120, 230 128 S 380 160, 460 138 S 610 96, 700 112 S 860 150, 940 128 S 1060 104, 1120 110"
            stroke="#C4CCD6" stroke-opacity=".35" stroke-width="3" fill="none"/>
      <path d="M0 132 C 100 120, 170 98, 250 110 S 400 142, 480 118 S 630 70, 720 92 S 870 128, 950 104 S 1070 84, 1120 88"
            stroke="#8FA8C8" stroke-opacity=".7" stroke-width="3" fill="none"/>
      <path d="M0 112 C 110 100, 180 70, 260 84 S 410 120, 500 92 S 650 40, 740 62 S 880 100, 960 74 S 1080 50, 1120 54 L 1120 220 L 0 220 Z"
            fill="url(#area)"/>
      <path d="M0 112 C 110 100, 180 70, 260 84 S 410 120, 500 92 S 650 40, 740 62 S 880 100, 960 74 S 1080 50, 1120 54"
            stroke="#FFFFFF" stroke-width="4" fill="none"/>
      <g fill="#1F3A5F" stroke="#FFFFFF" stroke-width="3">
        <circle cx="260" cy="84" r="7"/><circle cx="500" cy="92" r="7"/>
        <circle cx="740" cy="62" r="7"/><circle cx="960" cy="74" r="7"/>
      </g>
    </svg>

    <!-- Barra de color semántico (verde, naranja, rojo, gris) -->
    <div class="barra">
      <span style="background:var(--verde)"></span>
      <span style="background:var(--naranja)"></span>
      <span style="background:var(--rojo)"></span>
      <span style="background:var(--gris)"></span>
    </div>
  </div>

  <div class="pie"><div class="acento"></div></div>
</body>
</html>
